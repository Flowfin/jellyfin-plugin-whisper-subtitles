name: '📝 Draft the release notes from the merged pull requests'

# The changelog comes out of the history rather than being written by hand at
# release time, which is what #59 asks for. On every merge to master this
# drafts, or updates, one draft release whose notes are the merged pull requests
# since the last release, classified by their labels as `.github/release-drafter.yml`
# says, one line per pull request with its number. Run twice over the same merged
# pull requests with the same labels it writes the same notes, which is the
# fourth clause of #59 as decided on 2026-09-05.
#
# It drafts and does nothing else. The shared workflow this file used to call
# drafted and then pushed a `prepare-<version>` branch that rewrote
# `Directory.Build.props` and `build.yaml`, which put the version back in two
# files and was the first clause of #59 undone by the route meant to serve its
# fourth; `VersionSourceTests` refuses the tree that step produces. The same
# decision wants no release-prep half, so no branch is pushed and no file in the
# tree is written on account of this workflow. `ChangelogWorkflowTests` holds
# that: the one action here is the drafter, pinned, and no step names a push,
# a commit or an edit to the tree.
#
# `build.yaml` is left out of the trigger's paths on purpose: a change that only
# moves the manifest's version and changelog is the release being cut, and the
# draft it would produce is the one the tag then supersedes.

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:

# Deny at the workflow level so the job below has to name what it takes.
permissions: {}

jobs:
  draft:
    name: The next release is drafted from what merged
    runs-on: ubuntu-latest
    # The drafter writes the draft release, which is contents, and reads the
    # merged pull requests and their labels, which is pull-requests. Nothing
    # here checks the tree out, so no token reaches a checkout.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Draft or update the release notes
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
