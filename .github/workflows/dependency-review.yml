name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job, so the check run carries the job id
  # ("dependency-review") as its name. That name is the context the "gate" ruleset
  # names in order to require this check, so renaming this job would take the
  # requirement off a check that went on running green:
  #
  #     gh api repos/Flowfin/jellyfin-plugin-whisper-subtitles/rulesets/20467991 --jq '[.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | any(. == "dependency-review")'
  #     true
  #
  # Requiring it is the first thing #53 asks for, and it arrived under #54. This
  # comment said the ruleset did not name this check, which was true when it was
  # written and stopped being true at that merge. Two runs here read the required
  # set - pr-hygiene.yml prints it, and the fuzz workflow refuses to find its own
  # jobs in it - and neither compares a sentence against it, so nothing said so.
  #
  # This comment named another repository's ruleset until #53. That repository is
  # the one #49 measures this gate against, its ruleset does require this check
  # under this name, and the sentence read as though this repository's did too.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
