name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job, so the check run carries the job id
  # ("dependency-review") as its name. That name is the context a ruleset has to
  # name in order to require this check, and the "gate" ruleset does not name it
  # today. Requiring it is the first thing #53 asks for and #54 is where the
  # tightening is made, so the name is left alone because that decision is
  # written against it, not because anything would break now.
  #
  # This comment named another repository's ruleset until #53. That repository is
  # the one #49 measures this gate against, its ruleset does require this check
  # under this name, and the sentence read as though this repository's did too.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
