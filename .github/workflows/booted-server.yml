# The plugin, installed into a real server of a supported line, on a machine
# nobody wrote it on.
#
# Every test in the suite drives this plugin through doubles, and the one moment
# the suite cannot see is the plugin meeting a server: the server loads the
# assembly under its own rules, builds the scheduled task out of its own
# container, and lists what it loaded on its own routes. A task that compiles is
# not a task a server listed, and a registrator that resolves in a test is not one
# a server ran. So this boots a server with the built plugin installed and reads
# what it says, the way an operator would find out.
#
# Four things are read, and each is compared against what this tree says rather
# than against a value typed here: the log carries no error naming the plugin and
# does say the assembly loaded, the plugin is listed as active at the version the
# build stamped, the scheduled task is in the task list under its key, and the
# configuration page comes back byte for byte as the resource the plugin ships.
# .github/scripts/read-a-booted-server.sh is the reader, and the second job proves
# it refuses each of those going wrong, one at a time, against fixtures.
#
# The first job boots twice, from one definition, and the two legs have to end
# in opposite verdicts. One installs the build an operator receives and has to
# be read as a clean boot. The other installs the same build with one line added
# so its registrator throws on entry, and has to be refused by the reader with
# the throw quoted back, on a server that finished starting and answered every
# call before it. A fixture log can only say what a server is expected to write;
# the second leg is where the server writes it. Both legs end by removing the
# container and the directories the run made and refusing to leave anything
# behind, which is a clause of the issue rather than tidiness.
#
# One line of the two this tree builds. The 10.11 line has a released server and a
# manifest; the 12.0 line has neither, and build.yaml says why in its own first
# paragraph. So this boots 10.11 and says so in its job names, and the 12.0 boot
# arrives as further legs of the same matrix on the day that line has a server to
# pin. #63 is where both halves are argued.
#
# The image is pinned by digest as well as by tag, for the same reason every
# action here is pinned to a commit: a tag moves and a digest does not, and a boot
# against a server that quietly changed under the same name is a reading of
# something other than what this comment says.
name: Booted server

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "**" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boots:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build an operator receives, and the verdict it has to get.
          - build: shipped
            name: The plugin loads on a booted 10.11 server
          # The same build with its registrator made to throw, and the verdict
          # that one has to get.
          - build: throws-while-loading
            name: And a build that throws while loading turns it red for that reason
    env:
      # jellyfin/jellyfin:10.11.11, read from the registry on 2026-09-03:
      #   curl -sS https://hub.docker.com/v2/repositories/jellyfin/jellyfin/tags/10.11.11 | jq -r .digest
      SERVER_IMAGE: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
      SERVER_URL: http://127.0.0.1:8096
      FRAMEWORK: net9.0
      # What the poisoned registrator throws. The reader quotes the error entry
      # it refuses on, so the refusing leg can require this sentence in the
      # refusal and know it was read off the server's log and not off a fixture.
      POISON: thrown on purpose while loading, so the harness can be watched going red for it rather than timing out
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDKs both server lines are built against
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # One line added to the registrator, in the checkout on this runner and
      # nowhere else, so what boots below is this plugin's own build with its
      # registrator throwing on entry. The server catches that, logs it under the
      # assembly's name and marks the plugin failed; that is read off the server's
      # source on #71, and this leg is where it is watched rather than believed.
      # The guard around the throw is there for the compiler: an unconditional
      # throw makes every registration after it unreachable code, warnings are
      # errors in this tree, and the build would fail before anything booted,
      # which would turn this leg red for a reason that is not the one it names.
      - name: Add one line so the registrator throws while loading
        if: matrix.build == 'throws-while-loading'
        run: |
          set -eu
          file=Jellyfin.Plugin.WhisperSubtitles/PluginServiceRegistrator.cs
          anchor='ArgumentNullException.ThrowIfNull(serviceCollection);'
          hits=$(grep -cF "$anchor" "$file" || true)
          if [ "$hits" -ne 1 ]; then
            echo "The line the throw is added after, \"${anchor}\", occurs ${hits} time(s) in ${file} rather than once, so this leg cannot say what it poisoned." >&2
            exit 1
          fi
          printf '%s\n' \
            '        if (serviceCollection.Count >= 0)' \
            '        {' \
            "            throw new InvalidOperationException(\"${POISON}\");" \
            '        }' > "${RUNNER_TEMP}/poison.cs"
          sed -i "/${anchor}/r ${RUNNER_TEMP}/poison.cs" "$file"
          git --no-pager diff -- "$file"

      - name: Build what would ship for this line
        run: |
          set -eu
          dotnet publish Jellyfin.Plugin.WhisperSubtitles/Jellyfin.Plugin.WhisperSubtitles.csproj \
            --configuration Release \
            --framework "${FRAMEWORK}" \
            --output package-out \
            --nologo

      # The folder an operator ends up with: the assembly beside a meta.json that
      # says what it is, under the server's plugin directory. The four scalars
      # come out of build.yaml, which is the one place they are written, so the
      # server is told the same identity and version the release would carry.
      - name: Install the plugin the way an operator receives it
        run: |
          set -eu
          scalar() { sed -n "s/^$1: *\"\([^\"]*\)\".*/\1/p" build.yaml | head -n 1; }
          name=$(scalar name)
          guid=$(scalar guid)
          version=$(scalar version)
          target_abi=$(scalar targetAbi)
          for pair in "name=$name" "guid=$guid" "version=$version" "targetAbi=$target_abi"; do
            if [ -z "${pair#*=}" ]; then
              echo "build.yaml carries no ${pair%%=*}, so the plugin cannot be described to the server." >&2
              exit 1
            fi
          done

          folder="${RUNNER_TEMP}/server/config/plugins/WhisperSubtitles_${version}"
          mkdir -p "${folder}" "${RUNNER_TEMP}/server/cache" "${RUNNER_TEMP}/captures"
          cp package-out/Jellyfin.Plugin.WhisperSubtitles.dll "${folder}/"
          jq -n --arg name "$name" --arg guid "$guid" --arg version "$version" --arg abi "$target_abi" \
            '{name: $name, guid: $guid, version: $version, targetAbi: $abi, status: "Active", autoUpdate: false}' \
            > "${folder}/meta.json"

          # The server runs as root inside the container and writes into this
          # tree, so it is opened up rather than owned by anybody in particular.
          chmod -R a+rwX "${RUNNER_TEMP}/server"
          ls -l "${folder}"
          cat "${folder}/meta.json"

      - name: Start the server with the plugin installed
        run: |
          set -eu
          docker run --detach --name jellyfin \
            --publish 127.0.0.1:8096:8096 \
            --volume "${RUNNER_TEMP}/server/config:/config" \
            --volume "${RUNNER_TEMP}/server/cache:/cache" \
            "${SERVER_IMAGE}"

          # Two servers answer this port in turn, and both answer 200 on a route
          # a naive wait would use. While the real host is being built, a
          # setup server holds the port: it answers /health as degraded, which
          # is still a 200, answers /System/Info/Public with a public info of
          # its own, and answers everything else 503. Then the real host takes
          # the port and answers 503 on everything but /System/Ping until its
          # startup has completed. The second and third boots on the runner
          # reached the wizard between those two states and got a 503 on its
          # first call. So the wait is in two halves that only the finished
          # real host satisfies together: the ping, which the setup server
          # never answers with a 200, and then the public route, which the real
          # host answers with a 200 only once startup is complete.
          status() { curl -s -o /dev/null -w '%{http_code}' "${SERVER_URL}$1" 2>/dev/null || echo 000; }
          for attempt in $(seq 1 90); do
            if [ "$(status /System/Ping)" = "200" ]; then
              echo "the server host answers its ping after ${attempt} attempt(s)"
              break
            fi
            if [ "${attempt}" -eq 90 ]; then
              echo "The server host did not answer ${SERVER_URL}/System/Ping within three minutes." >&2
              docker logs jellyfin >&2 || true
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if [ "$(status /System/Info/Public)" = "200" ]; then
              echo "startup complete after ${attempt} more attempt(s): $(curl -fsS "${SERVER_URL}/System/Info/Public" | jq -r '"\(.ProductName) \(.Version)"')"
              exit 0
            fi
            sleep 2
          done
          echo "The server answered its ping and then did not finish starting within three minutes." >&2
          docker logs jellyfin >&2 || true
          exit 1

      # A fresh server answers its plugin and task routes only to an
      # administrator, and it has none until the first-run wizard has made one.
      # The wizard is driven the way the web client drives it, and the account it
      # makes lives as long as this container and no longer.
      - name: Finish the first-run wizard and sign in
        run: |
          set -eu
          # Each call prints its route and the status it got, and the first one
          # outside the 2xx range ends the step with the body the server sent,
          # so a wizard that changes shape names the call that changed.
          call() {
            verb=$1; route=$2; body=${3:-}
            if [ -n "$body" ]; then
              code=$(curl -s -o "${RUNNER_TEMP}/reply" -w '%{http_code}' -X "$verb" -H 'Content-Type: application/json' "${SERVER_URL}${route}" -d "$body")
            else
              code=$(curl -s -o "${RUNNER_TEMP}/reply" -w '%{http_code}' -X "$verb" "${SERVER_URL}${route}")
            fi
            echo "${verb} ${route} -> ${code}"
            case "$code" in
              2*) ;;
              *) echo "The server answered ${verb} ${route} with ${code}:" >&2; head -c 2000 "${RUNNER_TEMP}/reply" >&2; echo >&2; exit 1 ;;
            esac
          }
          call POST /Startup/Configuration '{"UICulture":"en-US","MetadataCountryCode":"US","PreferredMetadataLanguage":"en"}'
          call GET /Startup/User
          call POST /Startup/User '{"Name":"harness","Password":"harness-only-and-thrown-away"}'
          call POST /Startup/RemoteAccess '{"EnableRemoteAccess":false,"EnableAutomaticPortMapping":false}'
          call POST /Startup/Complete

          code=$(curl -s -o "${RUNNER_TEMP}/reply" -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'Authorization: MediaBrowser Client="booted-server", Device="runner", DeviceId="booted-server-runner", Version="0"' \
            "${SERVER_URL}/Users/AuthenticateByName" \
            -d '{"Username":"harness","Pw":"harness-only-and-thrown-away"}')
          echo "POST /Users/AuthenticateByName -> ${code}"
          token=$(jq -r '.AccessToken // empty' "${RUNNER_TEMP}/reply" 2>/dev/null || true)
          if [ -z "$token" ]; then
            echo "The server issued no access token, so nothing below can ask it what it loaded." >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          printf 'Authorization: MediaBrowser Token="%s"\n' "$token" > "${RUNNER_TEMP}/auth-header"
          rm -f "${RUNNER_TEMP}/reply"
          echo "signed in"

      - name: Capture what the server says about the plugin
        run: |
          set -eu
          captures="${RUNNER_TEMP}/captures"
          page=$(sed -n 's/^name: *"\([^"]*\)".*/\1/p' build.yaml | head -n 1)
          encoded=$(jq -rn --arg page "$page" '$page | @uri')

          curl -fsS -H @"${RUNNER_TEMP}/auth-header" "${SERVER_URL}/Plugins" > "${captures}/plugins.json"
          curl -fsS -H @"${RUNNER_TEMP}/auth-header" "${SERVER_URL}/ScheduledTasks" > "${captures}/tasks.json"
          curl -fsS -H @"${RUNNER_TEMP}/auth-header" "${SERVER_URL}/web/ConfigurationPage?name=${encoded}" > "${captures}/page.html"
          docker logs jellyfin > "${captures}/server.log" 2>&1

          echo "plugins:"; jq -r '.[] | "  \(.Name) \(.Version) \(.Status)"' "${captures}/plugins.json"
          echo "tasks:"; jq -r '.[] | "  \(.Key) \(.Name)"' "${captures}/tasks.json"
          echo "page: $(wc -c < "${captures}/page.html") byte(s)"
          echo "log: $(wc -l < "${captures}/server.log") line(s)"

      - name: The plugin loaded, is listed, has its task, and served its page
        if: matrix.build == 'shipped'
        run: .github/scripts/read-a-booted-server.sh "${RUNNER_TEMP}/captures"

      # Reaching this step is half of the verdict: the server behind the poisoned
      # build answered its ping, finished starting, took the wizard, issued a
      # token and served every capture, so whatever the reader says next is said
      # about a boot that happened and not about one that timed out. The other
      # half is that the reader refuses it, and for the throw: the sentence the
      # added line throws has to be in the refusal, which puts it in the server's
      # own log entry rather than in anything this workflow wrote.
      - name: The reader refuses that boot for the throw, on a server that had started
        if: matrix.build == 'throws-while-loading'
        run: |
          set -eu
          if output=$(.github/scripts/read-a-booted-server.sh "${RUNNER_TEMP}/captures" 2>&1); then
            echo "$output"
            echo "A build whose registrator throws while loading was read as a clean boot." >&2
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'The log carries an error that names the plugin'
          echo "$output" | grep -qF "${POISON}"

      # The issue asks that the run leave behind no container and no temporary
      # directory, and a step that removes them and swallows its own failure
      # would satisfy that on every run whether or not anything was removed. So
      # the removal is followed by a look. The server ran as root inside the
      # container and owns what it wrote under the config and cache trees, which
      # the runner's user cannot remove; the same image removes them as the same
      # user, with nothing else pulled for it, and the runner removes the rest.
      - name: Stop the server, and leave behind no container and no directory
        if: always()
        run: |
          set -eu
          echo "::group::server log"
          docker logs jellyfin 2>&1 | tail -n 200 || true
          echo "::endgroup::"
          docker rm -f -v jellyfin > /dev/null 2>&1 || true
          if [ -d "${RUNNER_TEMP}/server" ]; then
            docker run --rm --volume "${RUNNER_TEMP}/server:/server" --entrypoint /bin/sh "${SERVER_IMAGE}" \
              -c 'rm -rf /server/config /server/cache'
          fi
          rm -rf "${RUNNER_TEMP}/server" "${RUNNER_TEMP}/captures" "${RUNNER_TEMP}/auth-header" "${RUNNER_TEMP}/reply" "${RUNNER_TEMP}/poison.cs"

          containers=$(docker ps -aq | wc -l | tr -d ' ')
          if [ "$containers" -ne 0 ]; then
            echo "${containers} container(s) are still here after the run:" >&2
            docker ps -a >&2
            exit 1
          fi
          for path in "${RUNNER_TEMP}/server" "${RUNNER_TEMP}/captures"; do
            if [ -e "$path" ]; then
              echo "${path} is still here after the run." >&2
              exit 1
            fi
          done
          echo "no container and no directory of this run is left behind"

  refuses:
    name: And it refuses a boot that did not load the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The fixtures are written against the version build.yaml carries, so a
      # version bump moves them with it rather than turning this job red.
      - name: A capture of a boot that went right
        run: |
          set -eu
          version=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' build.yaml | head -n 1)
          mkdir clean
          for f in plugins.json tasks.json server.log; do
            sed "s/@VERSION@/${version}/g" ".github/fixtures/booted-server/${f}" > "clean/${f}"
          done
          cp Jellyfin.Plugin.WhisperSubtitles/Configuration/configPage.html clean/page.html

      # The neighbour first. Without it every leg below is satisfied by a reader
      # that refuses everything it is handed, which would be red on the real boot
      # as well and would be turned off within a week.
      - name: It passes, and says how much it read before saying so
        run: |
          set -eu
          output=$(.github/scripts/read-a-booted-server.sh clean)
          echo "$output"
          echo "$output" | head -n 1 | grep -q '^read 1 plugin(s), 2 task(s), a page of [0-9][0-9]* byte(s) and 5 log entries$'

      # The server writes the id without its dashes and build.yaml with them,
      # and the first boot on the runner was refused on exactly that. This is
      # the listing as the server writes it.
      - name: The id in the spelling the server uses is the same id
        run: |
          set -eu
          cp -r clean bare-id
          jq '(.[0].Id) = "30ed66e032fd46a68a565cd95d8df10f"' clean/plugins.json > bare-id/plugins.json
          .github/scripts/read-a-booted-server.sh bare-id

      - name: An error naming some other plugin is not an error naming this one
        run: |
          set -eu
          cp -r clean other-error
          printf '%s\n' '[03:14:18] [ERR] [1] Emby.Server.Implementations.Plugins.PluginManager: Failed to load assembly /config/plugins/Somebody.Elses.Plugin.dll. Disabling plugin' >> other-error/server.log
          .github/scripts/read-a-booted-server.sh other-error

      - name: A log never saying the assembly loaded is refused, whatever else it says
        run: |
          set -eu
          cp -r clean never-loaded
          grep -v 'Loaded assembly' clean/server.log > never-loaded/server.log
          if output=$(.github/scripts/read-a-booted-server.sh never-loaded 2>&1); then
            echo "$output"; echo "A log that never mentions the assembly was read as a clean boot." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'The log never says'

      - name: An error naming the plugin is refused, and quoted
        run: |
          set -eu
          cp -r clean errored
          printf '%s\n%s\n' \
            '[03:14:18] [ERR] [1] Emby.Server.Implementations.Plugins.PluginManager: Error registering plugin services from Jellyfin.Plugin.WhisperSubtitles, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null.' \
            'System.InvalidOperationException: a fixture exception' >> errored/server.log
          if output=$(.github/scripts/read-a-booted-server.sh errored 2>&1); then
            echo "$output"; echo "A log carrying an error naming the plugin was read as a clean boot." >&2; exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'The log carries an error that names the plugin'
          echo "$output" | grep -q 'a fixture exception'

      - name: A server listing no plugin at all is refused rather than read as a clean one
        run: |
          set -eu
          cp -r clean nothing-listed
          echo '[]' > nothing-listed/plugins.json
          if output=$(.github/scripts/read-a-booted-server.sh nothing-listed 2>&1); then
            echo "$output"; echo "An empty plugin listing was read as a server that loaded the plugin." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'listed no plugin at all'

      - name: A server that did not load the plugin is refused, naming what it did load
        run: |
          set -eu
          cp -r clean unlisted
          jq '[{"Name":"Some Other Plugin","Version":"2.0.0.0","Id":"11111111-2222-3333-4444-555555555555","Status":"Active"}]' \
            clean/plugins.json > unlisted/plugins.json
          if output=$(.github/scripts/read-a-booted-server.sh unlisted 2>&1); then
            echo "$output"; echo "A listing without the plugin was read as a server that loaded it." >&2; exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'none carries the id 30ed66e0-32fd-46a6-8a56-5cd95d8df10f'
          echo "$output" | grep -q 'Some Other Plugin'

      - name: A plugin the server disabled is refused, naming the status
        run: |
          set -eu
          cp -r clean disabled
          jq '(.[0].Status) = "Malfunctioned"' clean/plugins.json > disabled/plugins.json
          if output=$(.github/scripts/read-a-booted-server.sh disabled 2>&1); then
            echo "$output"; echo "A malfunctioned plugin was read as an active one." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'status "Malfunctioned" rather than Active'

      - name: A version other than the one the build stamped is refused, naming both
        run: |
          set -eu
          cp -r clean wrong-version
          jq '(.[0].Version) = "0.9.9.9"' clean/plugins.json > wrong-version/plugins.json
          if output=$(.github/scripts/read-a-booted-server.sh wrong-version 2>&1); then
            echo "$output"; echo "A plugin at another version was read as the one this tree built." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'version "0.9.9.9" and build.yaml says'

      - name: A task list without this plugin's task is refused, naming what is listed
        run: |
          set -eu
          cp -r clean no-task
          jq 'map(select(.Key != "WhisperSubtitlesGenerate"))' clean/tasks.json > no-task/tasks.json
          if output=$(.github/scripts/read-a-booted-server.sh no-task 2>&1); then
            echo "$output"; echo "A task list without the plugin's task was read as a server that built it." >&2; exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'no task carries the key WhisperSubtitlesGenerate'
          echo "$output" | grep -q 'RefreshLibrary'

      - name: A page that is not the one the plugin ships is refused
        run: |
          set -eu
          cp -r clean other-page
          printf '\n<!-- one more line than the resource has -->\n' >> other-page/page.html
          if output=$(.github/scripts/read-a-booted-server.sh other-page 2>&1); then
            echo "$output"; echo "A page differing from the shipped resource was read as the page having loaded." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'differs from the one this tree ships'

      - name: A page with no bytes is refused
        run: |
          set -eu
          cp -r clean empty-page
          : > empty-page/page.html
          if output=$(.github/scripts/read-a-booted-server.sh empty-page 2>&1); then
            echo "$output"; echo "An empty page was read as the page having loaded." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'with no bytes'

      - name: A capture that was never taken is refused rather than read as clean
        run: |
          set -eu
          if output=$(.github/scripts/read-a-booted-server.sh never-captured 2>&1); then
            echo "$output"; echo "A missing directory was read as a clean boot." >&2; exit 1
          fi
          echo "$output"; echo "$output" | grep -q 'nothing a server said was read'
