name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

# The called workflow declares no permissions of its own, so this job is the only
# place the bound can be written. Read at the pinned sha, it runs one label-sync
# step: it fetches its configuration over plain HTTPS, which needs no scope, and
# creates, edits and deletes labels, which is the issues API. It never checks the
# repository out.
permissions: {}

jobs:
  call:
    permissions:
      issues: write # labels are written through the issues API
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
