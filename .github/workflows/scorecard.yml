# OpenSSF Scorecard - supply-chain hygiene self-audit.
#
# Scorecard scores the repository against the OpenSSF supply-chain best-practice
# checks (Branch-Protection, Token-Permissions, Pinned-Dependencies,
# Dangerous-Workflow, etc.) and uploads the findings as SARIF to the
# code-scanning tab. The score is treated as a checklist, not a guarantee: each
# check is triaged (fixed or documented-accept), same as the other security
# insights. Where each finding ended up is docs/scorecard-dispositions.md, which
# also carries the command that lists them, so the record can be compared against
# a later run rather than believed.
#
# Runs where publishing is valid: on push to the default branch, on a weekly
# schedule (keeps the Maintained check fresh and re-scores on upstream changes),
# and on branch_protection_rule changes (the only event that lets the
# Branch-Protection check see the ruleset). No pull_request trigger - that path
# is experimental upstream and cannot publish results.
#
# Hardened per the repo's workflow policy (see zizmor.yml): every action is
# SHA-pinned with a version comment, checkout runs with persist-credentials:false,
# permissions are declared read-only at the top level and the write scopes are
# granted only on the job that needs them. This is a self-audit only - it does
# not build, test, or touch the publish/release pipeline. Note: publish_results
# below publishes the OpenSSF supply-chain *score* to the OpenSSF API (the public
# badge), not any software artifact - it is unrelated to the plugin release
# pipeline and only works when run from the default branch.
name: Scorecard supply-chain security

on:
  # Branch-Protection check only reads the default branch's ruleset.
  branch_protection_rule:
  # Keeps the Maintained check current and re-scores against upstream drift.
  schedule:
    - cron: "27 4 * * 1"
  push:
    # The default branch, read from the repository rather than from the name a
    # template used. This said `main` until #53, and the guard on the job below
    # compares the ref against the default branch, so the mismatch cost nothing
    # loud: the workflow simply never ran on a push, and the schedule was the
    # only route that ever reached it.
    branches: [master]

# Read-only by default; the analysis job adds only the scopes it needs. A
# read-only top-level declaration is itself one of the Token-Permissions checks
# Scorecard rewards. Declared as an explicit scope rather than read-all so it is
# minimal and specific (the job overrides this block with its own scopes).
permissions:
  contents: read

# A newer run on the same ref supersedes an in-flight one; this is an audit, not
# a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results only works from the default branch; guard so a run on any
    # other ref (e.g. a branch_protection_rule event on a non-default branch)
    # does not attempt to publish.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Clone the repo (public clone would also work anonymously, but declaring
      # the scope keeps checkout robust and is what Scorecard's Token-Permissions
      # check expects at the job level).
      contents: read
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF API (badge + public score) via OIDC.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: publish the score to the OpenSSF API so the badge and
          # the REST API reflect the current result.
          publish_results: true

      # Keep the raw SARIF as a run artifact for offline inspection/debugging.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Surface the findings in the code-scanning tab, alongside CodeQL and zizmor.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: scorecard

      # Last, and deliberately after both uploads. What this refuses is a record
      # rather than a build, so a failure here must never cost the publish or the
      # dashboard entry the steps above exist for.
      #
      # docs/scorecard-dispositions.md said in its own closing section that
      # nothing compared it against a run, and gave the reason: the finding list
      # comes from an API call and every test in this repository runs with the
      # machine offline. That is true of the suite and it is not true here. This
      # job already holds the findings, as the file it just uploaded, so the
      # comparison is a file against a file and reaches nothing.
      - name: Every finding it reported was decided about
        run: .github/scripts/refuse-an-undisposed-finding.sh results.sarif docs/scorecard-dispositions.md

  refuses:
    name: And a finding nobody decided about is refused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The neighbour first. Without it every leg below passes for a check that
      # refuses everything, which would be red on the real record too.
      - name: The fixture pair agrees and is accepted
        run: |
          set -eu
          cd .github/fixtures/scorecard-dispositions
          ../../scripts/refuse-an-undisposed-finding.sh results.sarif dispositions.md

      # The direction this exists for, and the one that has already happened: a
      # seventh finding arrived on its own with a change that was about something
      # else, and nothing said so.
      - name: A finding with no disposition is refused
        run: |
          set -eu
          cd .github/fixtures/scorecard-dispositions
          sed '/^## Fuzzing, score 0$/s/.*/## Fuzzing/' dispositions.md > no-entry.md
          if output=$(../../scripts/refuse-an-undisposed-finding.sh results.sarif no-entry.md 2>&1); then
            echo "$output"
            echo "The check passed a run reporting a finding the page does not decide about." >&2
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'the audit reports Fuzzing and no-entry.md records no disposition for it'

      - name: A disposition for a finding the run did not report is refused
        run: |
          set -eu
          cd .github/fixtures/scorecard-dispositions
          { cat dispositions.md; printf '\n## Signed-Releases, score 0\n\nAccepted for the fixture.\n'; } > stale-entry.md
          if output=$(../../scripts/refuse-an-undisposed-finding.sh results.sarif stale-entry.md 2>&1); then
            echo "$output"
            echo "The check passed a page recording a finding this run did not report." >&2
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'stale-entry.md records Signed-Releases and this run of the audit did not report it'

      # The score, because the reasoning under a heading is written against a
      # number, and a page whose numbers have moved is one nobody can compare.
      - name: A score the page records wrongly is refused
        run: |
          set -eu
          cd .github/fixtures/scorecard-dispositions
          sed 's/^## Branch-Protection, score 3$/## Branch-Protection, score 8/' dispositions.md > wrong-score.md
          if output=$(../../scripts/refuse-an-undisposed-finding.sh results.sarif wrong-score.md 2>&1); then
            echo "$output"
            echo "The check passed a page recording a score the run did not report." >&2
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'the audit scores Branch-Protection at 3 and wrong-score.md records it at 8'

      - name: A run reporting nothing is refused rather than read as a clean one
        run: |
          set -eu
          cd .github/fixtures/scorecard-dispositions
          jq '.runs = [.runs[] | .results = []]' results.sarif > nothing.sarif
          if output=$(../../scripts/refuse-an-undisposed-finding.sh nothing.sarif dispositions.md 2>&1); then
            echo "$output"
            echo "The check read a run reporting no finding as a run with nothing to decide about." >&2
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'reports no finding, so this run compared nothing'

      # A rule the run declares and does not report is not a finding. Reading the
      # rule list as the finding list would refuse the real page for every check
      # that passed.
      - name: A declared rule that is not a result is not read as a finding
        run: |
          set -eu
          cd .github/fixtures/scorecard-dispositions
          output=$(../../scripts/refuse-an-undisposed-finding.sh results.sarif dispositions.md)
          echo "$output"
          echo "$output" | grep -qv 'Token-Permissions'
