---
# One manifest describes one server line, and this tree builds two. The pair
# below is the 10.11 line, which is the one with a released server behind it.
#
# A second manifest for the 12.0 line is owned by #51, and it cannot be written
# today. It would promise servers from 12.0.0.0 upward, and net10.0 compiles
# against 12.0.0-rc4, so the promise would name a released server that no build
# here has ever seen. .github/scripts/read-abi-floor.sh refuses that shape,
# against a fixture that is the manifest which would have been written rather
# than one invented for the guard. The sentence this paragraph replaced named
# the owner and stopped there, which reads as packaging work waiting for
# somebody in this repository.
#
# What ends the wait is the 12.0 pin in Directory.Build.props becoming a
# release. SecondServerLineManifestTests reads that pin rather than trusting
# this paragraph, so the day the pin stops being a candidate is the day this
# explanation goes red instead of quietly going stale.
name: "Whisper Subtitles"
guid: "30ed66e0-32fd-46a6-8a56-5cd95d8df10f"
imageUrl: "https://raw.githubusercontent.com/Flowfin/jellyfin-plugin-whisper-subtitles/master/img/logo.png"
# 0.x on purpose, and the number is a claim somebody stands behind rather than a
# default. This plugin has published no release, so 1.0.0.0 said that its
# interfaces were settled and that an operator could upgrade within the major
# line without reading anything - neither of which anybody here has stood behind.
# #130 decided 0.1.0.0 on 2026-09-04, which is the same floor the sibling boards
# release at.
version: "0.1.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Transcribes library items that have no subtitle, using Whisper."
description: >
  Generates subtitles for library items that have none, by transcribing their
  audio with Whisper. The transcription itself runs outside the server process,
  through a command line tool on the same machine or through a remote
  transcription endpoint, and this plugin carries no model and no inference
  runtime of its own. What it produces is machine transcription: it is marked as
  machine made so it can be told apart from a subtitle a person wrote, and this
  plugin promises nothing about its accuracy, which it does not measure.
category: "General"
owner: "Flowfin"
artifacts:
- "Jellyfin.Plugin.WhisperSubtitles.dll"
changelog: >
  First release. Generates subtitles for library items that have none, by
  transcribing their audio with Whisper outside the server process, through a
  command line tool on the same machine or through a remote transcription
  endpoint. What it produces is marked as machine made.


  This release ships for the 10.11 server line only, and it goes out with two
  conditions of docs/release-checklist.md answered as known limitations rather
  than by a run: there is no interoperability matrix behind it, so no combination
  of this plugin with a sibling has been tested; and the comparison of the
  documentation against the archive an operator installs is not made, only the
  comparison of the documentation against the tree the archive was built from.
