<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Whisper Subtitles</title>
</head>
<body>
    <div id="WhisperSubtitlesConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="WhisperSubtitlesConfigForm">
                    <p class="fieldDescription">
                        This plugin has no settings yet. Each one arrives with the feature that reads it.
                    </p>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var WhisperSubtitlesConfig = {
                pluginUniqueId: '30ed66e0-32fd-46a6-8a56-5cd95d8df10f'
            };

            document.querySelector('#WhisperSubtitlesConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(WhisperSubtitlesConfig.pluginUniqueId).then(function () {
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#WhisperSubtitlesConfigForm')
                .addEventListener('submit', function(e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(WhisperSubtitlesConfig.pluginUniqueId).then(function (config) {
                    ApiClient.updatePluginConfiguration(WhisperSubtitlesConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
